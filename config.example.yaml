# config.example.yaml を config.yaml にコピーして編集する。
# config.yaml は志望企業などの個人情報を含むため Git にはコミットされない。
# Cloud Run には scripts/upload-secrets.sh で Secret Manager（app-config）経由で渡す。
# 書かなかった項目は初期値になる。数値は運用しながら調整する前提の仮の値。

triage:
  # 必要度 = deadline × 期限 + importance × 重要度 + interest × 興味度
  weights: { deadline: 0.4, importance: 0.25, interest: 0.35 }
  # 必要度が urgent 以上なら即時、digest 以上ならまとめ報告、それ未満は記録のみ
  # bulk_digest: 一斉配信（広告・スカウトの一斉送信）はこの値以上のときだけまとめ報告に載せる。一斉配信は即時にしない
  thresholds: { urgent: 0.7, digest: 0.4, bulk_digest: 0.5 }
  deadline_steps:          # 締切までの残り時間 → 期限の点数
    - { within_hours: 24,  score: 1.0 }
    - { within_hours: 72,  score: 0.7 }
    - { within_hours: 168, score: 0.4 }
  deadline_far: 0.2        # 1週間より先の締切
  importance_markers: ["【重要】", "【要返信】", "【必読】", "リマインド", "再送", "締切", "〆切"]
  marker_score: 0.7        # 目印があれば重要度をこの値以上にする
  bulk_discount: 0.5       # 一斉配信（ナビサイトの広告など）の重要度に掛ける係数
  phishing_tier: digest    # 詐欺の疑いがあるメールの最低の段階（urgent / digest / record）。誤検知があるので初期値は digest
  # true なら、返信・申込などの対応が要らないメールや、志望企業以外の説明会の案内は即時にせずまとめ報告に回す
  urgent_needs_action: true
  exclude:                 # 当たるメールは LLM に送らず「記録のみ」
    senders: []            # 例: ["grades@example.ac.jp"]
    subject_keywords: []   # 例: ["成績", "健康診断"]
    sources: ["不明"]        # 転送元ラベル単位で除外。「不明」は専用 Gmail 自身への通知など

jobhunt:
  # 興味の傾向。登録していない企業の興味度を LLM が推定するときに使う。
  profile: "自社開発の Web/インフラ系に興味。Go やクラウドを使う企業。"
  companies:               # interest: S / A / B / C / none（none は興味なし）
    - { name: "株式会社〇〇", aliases: ["〇〇"], interest: S }
  stale_after_days: 10     # 書類・面接の段階でこの日数連絡が無ければ、まとめ報告で知らせる
  keywords:                # 件名・本文に含まれていれば興味度をこの値以上にする
    インターン: 0.6
    早期選考: 0.9

llm:
  model: claude-haiku-4-5
  max_input_chars: 1500    # LLM に送る本文の最大文字数（判定に必要な情報はたいてい冒頭にある）
  daily_budget_usd: 0.5    # 1日の LLM 費用の上限。超えたらルールだけで判定する
  structured_output: false # true で JSON の形式を API 側で保証する（1通あたり約450トークン増える）

notify:
  quiet_hours: ["00:00", "07:00"]  # この間は即時通知を送らず、次のまとめ報告に回す（無効にするなら []）
  max_urgent_per_hour: 5           # 即時通知の上限。超えた分はまとめ報告に回す
  max_urgent_per_day: 20
  reminder_hours: [72, 24]         # 締切の何時間前にリマインドするか
  line_monthly_limit: 200          # LINE の月間送信数の上限（無料プランに合わせる）。近づいたらまとめ報告だけにする

digest:
  times: ["07:00", "21:00"]        # まとめ報告の時刻。正午より前は今日の予定、以降は明日の予定を載せる
  deadline_days: 3                 # 何日以内の締切を載せるか
  upcoming_days: 3                 # 今日（夜は明日）の予定に続けて、その先の何日分の予定を載せるか（0 で載せない）
  max_items: 10                    # まとめ待ちのメールを何通まで載せるか
